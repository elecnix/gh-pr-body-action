name: 'PR Body Format'
description: >-
  Flags a pull-request description that will render badly on GitHub: prose
  hard-wrapped mid-sentence, list items broken onto a second line, collapsed
  tables, and mermaid diagrams the mermaid parser rejects.
author: 'elecnix'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  repo:
    description: 'OWNER/REPO of the pull request to check. Defaults to the repository running the workflow.'
    required: false
    default: ${{ github.repository }}
  pr:
    description: 'Pull-request number. Defaults to the number from the pull_request event.'
    required: false
    default: ${{ github.event.pull_request.number }}
  comment:
    description: >-
      Pull-request comment id. When set, the format checker runs against that
      comment instead of the PR description (the mermaid checker has no comment
      mode and is skipped). Comment mode also skips the prose check, which
      lints a pull-request description and says so when it skips; wire a second
      step to lint both. Wiring both `comment` and `pr` is an error. Defaults to
      the comment id from the issue_comment event.
    required: false
    default: ${{ github.event.comment.id }}
  token:
    description: 'GitHub token used to read the PR body. Needs pull-requests: read at minimum.'
    required: false
    default: ${{ github.token }}
  node-version:
    description: 'Node.js major version used to run the mermaid checker.'
    required: false
    default: '24'
  prose:
    description: >-
      Lint the description against the calling repository's own prose rules
      (a .vale.ini in the checkout). On by default. The action ships no rules:
      a repo without a .vale.ini is skipped, out loud, with the reason. Set to
      'false' to turn the step off entirely.
    required: false
    default: 'true'
  prose-fail:
    description: >-
      Whether a prose finding fails the job. Off by default: the first version
      of this check reports, and the repo decides when it starts blocking. A
      prose linter that could not run at all still fails, whatever this is set
      to — a check that did not start has not passed.
    required: false
    default: 'false'
  prose-rules-dir:
    description: >-
      Directory holding the calling repo's .vale.ini. Defaults to the workspace,
      so `actions/checkout` must run before this action for the prose step to
      find anything.
    required: false
    default: ${{ github.workspace }}
  vale-version:
    description: 'Vale release used for the prose step.'
    required: false
    default: '3.20.0'

outputs:
  violations:
    description: 'The combined exit code of the two checkers (0 clean, 1 violation, 2 read/usage failure).'
    value: ${{ steps.check.outputs.rc }}
  prose:
    description: 'The prose checker exit code (0 clean or skipped, 1 finding, 2 could not run).'
    value: ${{ steps.check.outputs.prose_rc }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # No npm cache: setup-node can only cache a lockfile inside the
        # caller's workspace, and this action's lockfile lives under
        # github.action_path (_actions/...), which it refuses to resolve.
        # `npm ci` takes seconds without the cache.

    - name: Install checker dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/scripts
      run: npm ci

    # vale is provisioned, not reasoned about. The orchestrator below decides
    # whether the prose check runs at all, so the only question left here is
    # whether this job asked for prose in the first place. A comment-mode run
    # therefore installs a binary the orchestrator will not call; the
    # alternative is choosing the mode here as well, which is the split this
    # change exists to remove.
    - name: Install vale
      if: ${{ always() && inputs.prose == 'true' }}
      shell: bash
      env:
        VALE_VERSION: ${{ inputs.vale-version }}
      run: |
        set -euo pipefail
        # The install lives in one script that ci.yml calls too, so the
        # architecture switch and the RUNNER_TEMP destination (and not
        # /usr/local/bin, which needs root on some self-hosted runners) are
        # decided in a single place.
        echo "$(${{ github.action_path }}/scripts/install-vale.sh)" >> "$GITHUB_PATH"

    # Every decision the action makes lives in one script, because every one of
    # them is a rule: which surface to check, which checkers to run and in what
    # order, how their exit codes combine, and what a prose finding is worth.
    # It was bash in three `run:` blocks here, which had no test file and no CI
    # job — the shellcheck job globs scripts/*.sh, and a `run:` block is not a
    # file. See the docstring of the orchestrator for each rule.
    - name: Check PR body
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr }}
        COMMENT_ID: ${{ inputs.comment }}
        PROSE: ${{ inputs.prose }}
        PROSE_FAIL: ${{ inputs.prose-fail }}
        RULES_DIR: ${{ inputs.prose-rules-dir }}
      run: |
        python3 "${{ github.action_path }}/scripts/check-pr-body-orchestrator.py" \
          --repo "$PR_REPO" \
          --pr "$PR_NUMBER" \
          --comment "$COMMENT_ID" \
          --prose "$PROSE" \
          --prose-fail "$PROSE_FAIL" \
          --rules-dir "$RULES_DIR"
