name: 'PR Body Format'
description: >-
  Flags a pull-request description that will render badly on GitHub: prose
  hard-wrapped mid-sentence, list items broken onto a second line, collapsed
  tables, and mermaid diagrams the mermaid parser rejects.
author: 'elecnix'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  repo:
    description: 'OWNER/REPO of the pull request to check. Defaults to the repository running the workflow.'
    required: false
    default: ${{ github.repository }}
  pr:
    description: 'Pull-request number. Defaults to the number from the pull_request event.'
    required: false
    default: ${{ github.event.pull_request.number }}
  comment:
    description: >-
      Pull-request comment id. When set, the format checker runs against that
      comment instead of the PR description (the mermaid checker has no comment
      mode and is skipped). Mutually exclusive with pr. Defaults to the comment
      id from the issue_comment event.
    required: false
    default: ${{ github.event.comment.id }}
  token:
    description: 'GitHub token used to read the PR body. Needs pull-requests: read at minimum.'
    required: false
    default: ${{ github.token }}
  node-version:
    description: 'Node.js major version used to run the mermaid checker.'
    required: false
    default: '22'
  prose:
    description: >-
      Lint the description against the calling repository's own prose rules
      (a .vale.ini in the checkout). On by default. The action ships no rules:
      a repo without a .vale.ini is skipped, out loud, with the reason. Set to
      'false' to turn the step off entirely.
    required: false
    default: 'true'
  prose-fail:
    description: >-
      Whether a prose finding fails the job. Off by default: the first version
      of this check reports, and the repo decides when it starts blocking. A
      prose linter that could not run at all still fails, whatever this is set
      to — a check that did not start has not passed.
    required: false
    default: 'false'
  prose-rules-dir:
    description: >-
      Directory holding the calling repo's .vale.ini. Defaults to the workspace,
      so `actions/checkout` must run before this action for the prose step to
      find anything.
    required: false
    default: ${{ github.workspace }}
  vale-version:
    description: 'Vale release used for the prose step.'
    required: false
    default: '3.20.0'

outputs:
  violations:
    description: 'The combined exit code of the two checkers (0 clean, 1 violation, 2 read/usage failure).'
    value: ${{ steps.check.outputs.rc }}
  prose:
    description: 'The prose checker exit code (0 clean or skipped, 1 finding, 2 could not run).'
    value: ${{ steps.prose.outputs.rc }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # No npm cache: setup-node can only cache a lockfile inside the
        # caller's workspace, and this action's lockfile lives under
        # github.action_path (_actions/...), which it refuses to resolve.
        # `npm ci` takes seconds without the cache.

    - name: Install checker dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/scripts
      run: npm ci

    - name: Check PR body formatting
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr }}
        COMMENT_ID: ${{ inputs.comment }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        if [ -z "$PR_NUMBER" ] && [ -z "$COMMENT_ID" ]; then
          echo "::notice::No pull-request number or comment id available (not a pull_request or issue_comment event); skipping."
          echo "rc=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Both checkers run even when one is red, so an author with a wrapped
        # paragraph AND a bad diagram sees both findings in one run. errexit is
        # on by default, so capture each rc with it off.
        set +e
        if [ -n "$COMMENT_ID" ]; then
          # Comment mode: one comment, one REST fetch, and the mermaid checker
          # does not apply to it. Comment text is attacker-influenceable, so
          # the job stays read-only and never gains write scopes; the checker
          # defangs `::` workflow commands when it echoes findings.
          python3 "$ACTION_DIR/scripts/check-pr-body-format.py" \
            --repo "$PR_REPO" --comment "$COMMENT_ID"
          rc1=$?
          echo "rc=$rc1" >> "$GITHUB_OUTPUT"
          set -e
          exit "$rc1"
        fi
        python3 "$ACTION_DIR/scripts/check-pr-body-format.py" \
          --repo "$PR_REPO" --pr "$PR_NUMBER"
        rc1=$?
        node "$ACTION_DIR/scripts/check-pr-body-mermaid.mjs" \
          --repo "$PR_REPO" --pr "$PR_NUMBER"
        rc2=$?
        set -e
        rc=$((rc1 || rc2))
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        exit "$rc"

    # The prose step runs after the format step and never short-circuits it: an
    # author with a wrapped paragraph AND an off-house sentence should see both
    # in one run rather than one per push.
    - name: Install vale
      if: ${{ always() && inputs.prose == 'true' && inputs.pr != '' }}
      shell: bash
      env:
        VALE_VERSION: ${{ inputs.vale-version }}
      run: |
        set -euo pipefail
        arch=$(uname -m)
        case "$arch" in
          x86_64) asset=64-bit ;;
          aarch64|arm64) asset=arm64 ;;
          *) echo "::error::vale has no release asset for $arch"; exit 2 ;;
        esac
        url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_${asset}.tar.gz"
        # Into RUNNER_TEMP, not /usr/local/bin: the latter needs root on some
        # self-hosted runners and this step has no reason to need it.
        bin="${RUNNER_TEMP:-/tmp}/vale-bin"
        mkdir -p "$bin"
        curl -fsSL "$url" | tar -xz -C "$bin" vale
        chmod +x "$bin/vale"
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/vale" --version

    - name: Check PR body prose
      id: prose
      if: ${{ always() && inputs.prose == 'true' && inputs.pr != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr }}
        RULES_DIR: ${{ inputs.prose-rules-dir }}
        PROSE_FAIL: ${{ inputs.prose-fail }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set +e
        python3 "$ACTION_DIR/scripts/check-pr-body-prose.py" \
          --repo "$PR_REPO" --pr "$PR_NUMBER" --rules-dir "$RULES_DIR"
        rc=$?
        set -e
        echo "rc=$rc" >> "$GITHUB_OUTPUT"
        # rc 2 is "the linter never ran", which is a failure however the repo
        # has set prose-fail: a check that did not start has not passed.
        if [ "$rc" -ge 2 ]; then
          echo "::error::The prose check could not run."
          exit 1
        fi
        if [ "$rc" -eq 1 ] && [ "$PROSE_FAIL" = "true" ]; then
          exit 1
        fi
        if [ "$rc" -eq 1 ]; then
          echo "::warning::The description does not match this repository's prose rules; see the step log."
        fi
