name: ci

# Unit tests for both checkers. The dogfood workflow (pr-body-format.yml)
# exercises the composite action end-to-end on this repo's own PRs; this
# workflow pins the checker logic itself so a regression re-breaks a test
# rather than a merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Stdlib unittest only — no install step needed.
      - name: Python checker unit tests
        run: python3 scripts/test_check_pr_body_format.py

  test-prose-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Vale is a hard requirement here, never a skip. The two tests that matter
      # both need a real vale run: the one proving a markdown-scoped rule still
      # fires on a .txt body, and its control proving that body reports clean
      # without the copy. Skipping them would leave the trap untested while the
      # suite still reported green.
      - name: Install vale
        env:
          VALE_VERSION: '3.20.0'
        run: |
          set -euo pipefail
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/vale-bin"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/vale-bin" vale
          chmod +x "$RUNNER_TEMP/vale-bin/vale"
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"

      - name: Prose checker unit tests
        run: |
          set -euo pipefail
          command -v vale
          python3 scripts/test_check_pr_body_prose.py

  fixture-scrub:
    # Every fixture in this public repo was written beside a private one. This
    # is the gate that stops a borrowed name riding along on a paste.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scrub fixtures for borrowed terms
        run: ./scripts/fixture-scrub.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  test-mermaid-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install mermaid checker dependencies
        working-directory: scripts
        run: npm ci

      - name: Mermaid checker unit tests
        working-directory: scripts
        run: npm test
